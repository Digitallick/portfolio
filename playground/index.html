#pg .code .ln i{font-style:normal;color:#B5B5B5;text-align:right;padding-right:14px;user-select:none}
#pg .code .ln.hl{background:#FCE9FF}
#pg .code .ln.wn{background:#FFF3DC}
#pg .k{color:#8A00A3}
#pg .s{color:#007A73}
#pg .c{color:#9A9A9A}
#pg .n{color:#B05A00}
#pg .panel{overflow:auto;padding:12px 16px;line-height:1.65;background:#FCFCFB}
#pg .log div{white-space:pre-wrap;animation:pgap .18s ease both}
@keyframes pgap{from{opacity:0}}
#pg .ok{color:#007A73}
#pg .bad{color:#B0006E}
#pg .warn{color:#8F5400}
#pg .dim{color:#9A9A9A}
#pg .vd{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:600}
#pg .vd.BLOCK{background:#FBC8FF}
#pg .vd.WARN{background:#FFE6B8}
#pg .vd.PASS{background:#C7FFF9}
#pg table.res{width:100%;border-collapse:collapse;font-size:12px}
#pg table.res th,#pg table.res td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
#pg table.res th{color:var(--mute);font-weight:400}
#pg table.res td.num{text-align:right;font-variant-numeric:tabular-nums}
#pg .mini{display:inline-block;height:6px;border-radius:3px;background:#00C4BD;vertical-align:middle;margin-right:6px}
#pg .ask{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
#pg .ask input{flex:1;min-width:0;height:34px;border:1px solid #D4D4D4;border-radius:6px;padding:0 10px;font-family:var(--mono);font-size:12.5px}
#pg /* index */
.idx{padding:72px 0 0}
#pg .idx-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:16px}
#pg .idx h2{margin:0;font-size:clamp(1.6rem,3vw,2.4rem);line-height:1;letter-spacing:-.02em;text-transform:uppercase}
#pg .idx-h span{font-family:var(--mono);font-size:12px;color:var(--mute)}
#pg .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink)}
#pg .cell{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px 12px 0;border-bottom:1px solid var(--line);margin-right:16px}
#pg .cell:hover b{color:var(--pop)}
#pg .cell b{font-weight:400;font-size:15px}
#pg .cell small{font-family:var(--mono);font-size:11.5px;color:var(--mute);white-space:nowrap}
#pg .cell small.ok{color:#007A73}
#pg .brief{display:grid;grid-template-columns:72px minmax(0,46ch);gap:12px 20px;margin:0 0 28px}
#pg .brief dt{font-family:var(--mono);font-size:11.5px;color:var(--mute);padding-top:3px}
#pg .brief dd{margin:0;font-size:14.5px;line-height:1.5}
#pg .brief dd.stk{display:flex;flex-wrap:wrap;gap:6px}
#pg .brief dd.p{font-size:16px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
#pg .try{border-top:1px solid #DADADA;padding-top:18px;max-width:calc(46ch + 92px)}
#pg .try h3{margin:0 0 10px;font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--mute)}
#pg .try ol{margin:0;padding:0;list-style:none;counter-reset:s}
#pg .try li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;font-size:14.5px;line-height:1.5;margin-bottom:8px}
#pg .try li::before{content:counter(s);width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px;display:grid;place-items:center;margin-top:2px}
#pg .try p{margin:12px 0 0;font-size:13.5px;color:var(--ink);padding:10px 12px;background:#fff;border-radius:8px;border:1px dashed #CFCFCF}
#pg .src{margin-top:16px;font-family:var(--mono);font-size:13px}
#pg .src a{text-decoration:underline;text-decoration-color:#DD00FF;text-decoration-thickness:2px;text-underline-offset:4px}
#pg .memo{width:100%;height:100%;border:0;resize:none;padding:12px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.65;background:#fff;color:var(--ink)}
#pg .memo:focus{outline:none;background:#FFFDF6}
#pg .edit{position:sticky;float:right;margin:4px 14px 0 0;bottom:8px;font-family:var(--mono);font-size:11.5px;border:1px solid #D4D4D4;border-radius:4px;background:#fff;padding:2px 8px;cursor:pointer}
#pg .codewrap{position:relative;overflow:auto}
#pg .rows{border-top:1px solid var(--ink)}
#pg .row{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,2.4fr) 110px minmax(0,1.6fr);gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
#pg .row:hover .nm{color:var(--pop)}
#pg .row .nm{font-size:16px}
#pg .row .pb{font-size:14.5px;line-height:1.45}
#pg .row .st{font-family:var(--mono);font-size:11.5px}
#pg .row .pf{font-family:var(--mono);font-size:11.5px;color:var(--mute);line-height:1.5}
#pg .row .st.alive{color:#8A00A3}
#pg .row .st.hatch{color:#8F5400}
#pg .rowh{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,2.4fr) 110px minmax(0,1.6fr);gap:20px;padding:0 0 8px;font-family:var(--mono);font-size:11px;color:var(--mute)}
