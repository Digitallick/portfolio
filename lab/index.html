body{margin:0;background:#FFFFFF}

.H{font-family:'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;text-transform:uppercase}
.rule{height:1px;background:linear-gradient(90deg,#DD00FF,#00FFF7,#FCA002,#FFFF00,#DD00FF);background-size:200% 100%;animation:slide 8s linear infinite}

.egg{animation:pop .35s ease-out}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.jar{position:relative;text-align:left;cursor:pointer;border:0;padding:0;background:transparent;font:inherit;color:inherit}
.jar .glass{position:relative;border-radius:30px 30px 22px 22px;border:2px solid #262626;background:linear-gradient(160deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.6) 40%,var(--tint) 100%);min-height:250px;padding:44px 20px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.jar .lid{position:absolute;left:18%;right:18%;top:-12px;height:18px;border-radius:8px;border:2px solid #262626;background:#262626}
.jar .shine{position:absolute;left:14px;top:30px;width:8px;height:60%;border-radius:8px;background:rgba(255,255,255,.9)}
.jar:hover .glass{transform:translateY(-6px) rotate(-1.2deg)}
.jar.on .glass{box-shadow:0 0 0 4px #FFFFFF,0 0 0 6px #262626}
.jar .tape{align-self:flex-start;background:#FFFFFF;border:1px solid #262626;padding:4px 10px;transform:rotate(-2deg);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.stamp{display:inline-block;padding:2px 8px;border:2px double currentColor;border-radius:4px;font-family:'TeX Gyre Heros',Helvetica,Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;transform:rotate(-4deg)}
.bubble{position:absolute;bottom:14px;border-radius:50%;border:1.5px solid rgba(38,38,38,.5);animation:rise 3.6s ease-in infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-150px);opacity:0}}
.term{background:#1E1E1E;color:#EDEDED;border-radius:22px;overflow:hidden;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:13.5px;line-height:1.6}
.term .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#2A2A2A}
.term .dot{width:11px;height:11px;border-radius:50%}
.preset{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFCFCF;background:#FFFFFF;cursor:pointer;font-family:inherit;font-size:13px}
.preset.on{background:#262626;color:#FFFFFF;border-color:#262626}
.sent{padding:1px 2px;border-radius:4px}
.sent.block{background:rgba(221,0,255,.18);box-shadow:inset 0 -2px 0 #DD00FF}
.sent.warn{background:rgba(252,160,2,.2);box-shadow:inset 0 -2px 0 #FCA002}
.sk{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFCFCF;background:#FFFFFF;cursor:pointer;font-family:inherit;font-size:13px}
.sk.on{background:#262626;color:#FFFFFF;border-color:#262626}
.step{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid #E4E4E4;transition:opacity .3s ease}
.step.off{opacity:.25}
.tube{position:absolute;left:34px;top:50px;font-size:32px;line-height:1;transform:rotate(-20deg)}
.tube i{position:absolute;left:12px;top:-4px;width:7px;height:7px;border-radius:50%;border:1.5px solid #00B8B2;background:rgba(184,255,252,.6);opacity:0;animation:fizz 2.2s ease-in infinite}
.tube i:nth-child(2){left:18px;width:5px;height:5px;animation-delay:.7s;border-color:#DD00FF}
.tube i:nth-child(3){left:8px;width:9px;height:9px;animation-delay:1.4s;border-color:#FCA002}
@keyframes fizz{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(6px,-46px);opacity:0}}
.tube.fast i{animation-duration:.7s}
.bk{border-radius:24px;min-height:220px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;border:1px dashed #9A9A9A}
.wig{animation:wig .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes wig{0%{transform:rotate(0) scale(1)}20%{transform:rotate(-14deg) scale(1.08)}40%{transform:rotate(12deg) scale(.96)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}100%{transform:rotate(0) scale(1)}}

.asst{position:absolute;right:0;bottom:18px;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.asst .pet{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nudge{display:none}

.mmenu{position:fixed;inset:0;z-index:90;font-family:'Neue Haas Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.5px;color:#262626;background:linear-gradient(to top,#FFF3FE 0%,#FFFFFF 45%);display:flex;flex-direction:column;padding:20px 24px 28px;box-sizing:border-box;overflow-y:auto;animation:mpop .25s ease-out}

/* ---- jars on a lab bench ---- */
.jar .gas{position:absolute;left:50%;top:0;width:0;height:0;z-index:4;pointer-events:none}
.jar .gas i{position:absolute;left:0;top:0;border-radius:50%;background:var(--tint);border:1.5px solid rgba(38,38,38,.35);opacity:0}
.jar.f1 .cap{animation:pop1 .9s cubic-bezier(.3,1.5,.5,1)}
.jar.f2 .cap{animation:pop2 .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop1{0%{transform:none}25%{transform:translateY(-46px) rotate(-24deg)}70%{transform:translateY(-30px) rotate(-14deg)}100%{transform:none}}
@keyframes pop2{0%{transform:none}25%{transform:translateY(-46px) rotate(22deg)}70%{transform:translateY(-30px) rotate(12deg)}100%{transform:none}}
.jar.f1 .gas i{animation:gas1 1.1s ease-out forwards}
.jar.f2 .gas i{animation:gas2 1.1s ease-out forwards}
@keyframes gas1{0%{opacity:0;transform:translate(0,10px) scale(.3)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
@keyframes gas2{0%{opacity:0;transform:translate(0,10px) scale(.3)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
@media (prefers-reduced-motion:reduce){.jar.f1 .cap,.jar.f2 .cap,.jar.f1 .gas i,.jar.f2 .gas i{animation:none}}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));column-gap:0;row-gap:56px}
.jar{padding:0 10px 30px;display:flex;flex-direction:column;align-items:center}
.jar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(#FFFFFF 0 3px,var(--bench) 3px 14px,#262626 14px 16px,var(--benchEdge) 16px);border-top:2px solid #262626;border-bottom:2px solid #262626}
.jar.nobench::after{display:none}
.jar .cap{position:relative;z-index:2;width:58%;height:22px;border:2px solid #262626;border-radius:6px 6px 3px 3px;background:repeating-linear-gradient(90deg,#262626 0 3px,#4a4a4a 3px 9px);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.jar .neck{position:relative;z-index:1;width:52%;height:12px;margin-top:-2px;border:2px solid #262626;border-top:0;border-bottom:0;background:rgba(255,255,255,.75)}
.jar .glass{width:100%;margin-top:-2px;border-radius:34px 34px 26px 26px;min-height:280px;padding:22px 14px 14px;overflow:hidden;background:rgba(255,255,255,.72);gap:0}
.jar .liquid{position:absolute;left:0;right:0;bottom:0;background:var(--tint);opacity:.9;transition:height .6s ease}
.jar .liquid::before{content:"";position:absolute;left:-10%;right:-10%;top:-9px;height:18px;border-radius:50%;background:var(--tint)}
.jar .shine{z-index:1}
.jar .bubble{z-index:1}
.jar .label{position:relative;z-index:2;margin-top:auto;background:#FFFDF6;border:1.5px solid #262626;border-radius:6px;padding:10px 12px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 0 rgba(38,38,38,.12);transform:rotate(-0.6deg)}
.jar .label .H{font-size:1.25rem !important}
.jar .label .ln{font-size:13px;line-height:1.45}
.jar .tape{position:absolute;top:-13px;right:8px;z-index:3;font-size:10px !important;padding:3px 8px !important;white-space:nowrap;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis}
.jar .glass::before{content:"";position:absolute;left:12px;top:26px;width:7px;height:45%;border-radius:8px;background:rgba(38,38,38,.07);z-index:1}
.jar:hover .glass{transform:none}
.jar:hover .cap{transform:translateY(-10px) rotate(-8deg)}
.jar:hover .label{transform:rotate(0.6deg)}
.jar.on .glass{box-shadow:0 0 0 4px #FFFFFF,0 0 0 6px #262626}
.shadow{position:absolute;bottom:20px;left:18%;right:18%;height:10px;border-radius:50%;background:rgba(38,38,38,.18);filter:blur(3px);z-index:0}

<section aria-label="The vibration plate" style="position: relative; margin-top: 8px">

<section aria-labelledby="shelf-h" style="margin-top: 64px">

<div>
<p style="margin: 0 0 10px; font-size: 13.5px; text-transform: uppercase">The specimen shelf · {{count}} experiments</p>
<h2 id="shelf-h" class="H" style="margin: 0; font-size: 3.2rem; line-height: 1; letter-spacing: -1px">Pick a jar</h2>

<button class="{{s.cls}}" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}">{{s.label}}</button>
</template>
</div>
</div>
<div class="shelf">
<template sc-for list="{{jars}}" as="j" hint-placeholder-count="5">
<button class="{{j.cls}}" onClick="{{j.pick}}" aria-pressed="{{j.pressed}}" style="--tint: {{j.tint}}; --bench: {{bench}}; --benchEdge: {{benchEdge}}">
<span class="cap" aria-hidden="true"></span><span class="gas" aria-hidden="true"><i style="width:14px;height:14px;margin:-7px;--dx:-34px;--dy:-70px;animation-delay:0s"></i><i style="width:20px;height:20px;margin:-10px;--dx:8px;--dy:-96px;animation-delay:.05s"></i><i style="width:10px;height:10px;margin:-5px;--dx:30px;--dy:-60px;animation-delay:.12s"></i><i style="width:26px;height:26px;margin:-13px;--dx:-12px;--dy:-120px;animation-delay:.18s"></i><i style="width:12px;height:12px;margin:-6px;--dx:44px;--dy:-104px;animation-delay:.24s"></i><i style="width:8px;height:8px;margin:-4px;--dx:-46px;--dy:-112px;animation-delay:.3s"></i></span><span class="neck" aria-hidden="true"></span>

<span class="shine" aria-hidden="true"></span>
<template sc-for list="{{j.bubbles}}" as="b" hint-placeholder-count="3"><span class="bubble" aria-hidden="true" style="{{b}}"></span></template>
<div class="label">
<span class="tape">{{j.kind}}</span>
<span class="H" style="line-height: 1.05; letter-spacing: -0.5px; margin-top: 6px">{{j.name}}</span>
<span class="ln">{{j.line}}</span>
<span style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px"><span class="stamp" style="color: {{j.stampColor}}">{{j.stage}}</span><span style="font-size: 11px; text-transform: uppercase">{{j.cta}}</span></span>

</div>
<span class="shadow" aria-hidden="true"></span>
</button>
</template>
</div>

<template sc-if value="{{showAttestor}}" hint-placeholder-val="{{ true }}">
<div class="egg">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px">
<div>
<p style="margin: 0 0 8px; font-size: 13.5px; text-transform: uppercase">Live demo · attestor v0.1.0 · runs in your browser</p>
<h3 class="H" style="margin: 0; font-size: 2.4rem; line-height: 1; letter-spacing: -1px">Try to sneak a bad memo past it</h3>
</div>
<a href="https://github.com/digitallick/attestor" target="_blank" rel="noopener" style="font-size: 13.5px; text-transform: uppercase; padding: 10px 0">Repo ↗</a>
</div>
<div class="lab2">
<div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px">
<template sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
<button class="{{p.cls}}" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}">{{p.label}}</button>
</template>
</div>
<label for="memo" style="display: block; font-size: 12px; text-transform: uppercase; margin-bottom: 6px">The AI's answer (edit it, cite sources as [S1])</label>
<textarea id="memo" ref="{{memoRef}}" onInput="{{memoInput}}" rows="9" style="width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; border: 1px solid #CFCFCF; font-family: inherit; font-size: 14px; line-height: 1.55; resize: vertical">{{memo}}</textarea>
<p style="margin: 14px 0 6px; font-size: 12px; text-transform: uppercase">The sources it was given</p>
<template sc-for list="{{srcList}}" as="s" hint-placeholder-count="3">
<p style="margin: 0 0 8px; padding: 10px 12px; border-radius: 12px; background: #F6F6F6; font-size: 13px; line-height: 1.5"><b>[{{s.id}}]</b> {{s.text}}</p>
</template>
<button onClick="{{run}}" class="H" style="margin-top: 8px; min-height: 56px; padding: 0 26px; border-radius: 999px; border: 0; background: #262626; color: #FFFFFF; cursor: pointer; font-size: 14px">Run attestor ▸</button>
</div>
<div class="term">
<div class="bar"><span class="dot" style="background: #DD00FF"></span><span class="dot" style="background: #FCA002"></span><span class="dot" style="background: #00FFF7"></span><span style="margin-left: 8px; font-size: 12px; color: #BDBDBD">attestor — finance pack</span></div>
<div class="termbody" style="padding: 18px 20px; min-height: 380px">
<p style="margin: 0; color: #00FFF7">$ attestor check memo.json</p>
<template sc-if value="{{ran}}" hint-placeholder-val="{{ true }}">
<p style="margin: 10px 0 12px"><span style="display: inline-block; padding: 2px 10px; border-radius: 4px; font-weight: 700; background: {{verdictBg}}; color: #1E1E1E">{{verdict}}</span> <span style="color: #BDBDBD">{{summary}}</span></p>
<template sc-for list="{{findings}}" as="f" hint-placeholder-count="5">
<p style="margin: 0 0 8px"><span style="color: {{f.color}}">{{f.sev}}</span> <span style="color: #BDBDBD">{{f.check}}</span>{{f.where}}<br><span>{{f.message}}</span><br><span style="color: #8F8F8F; font-size: 12px">{{f.refs}}</span></p>
</template>
</template>
<template sc-if value="{{notRan}}" hint-placeholder-val="{{ false }}">
<p style="margin: 10px 0 0; color: #8F8F8F">Press Run. No API key, no server: the checks run right here.</p>
</template>
</div>
</div>
</div>
<p style="margin: 16px 0 0; font-size: 13px; line-height: 1.55; max-width: 860px">The page runs a JavaScript port of attestor's finance-pack rules: citation grounding, phantom citations, coverage, PII, required disclosures and promissory wording. On the repo's three example memos it returns the same findings as the Python package. Northwind is a fictional company.</p>
</div>
</template>

<template sc-if value="{{showKit}}" hint-placeholder-val="{{ false }}">
<div class="egg">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px">
<div>
<p style="margin: 0 0 8px; font-size: 13.5px; text-transform: uppercase">Claude Code plugin · 7 skills · eval results v0.1.0</p>
<h3 class="H" style="margin: 0; font-size: 2.4rem; line-height: 1; letter-spacing: -1px">Same model. With and without the kit.</h3>
</div>
<a href="https://github.com/digitallick/regulated-ai-pm" target="_blank" rel="noopener" style="font-size: 13.5px; text-transform: uppercase; padding: 10px 0">Repo ↗</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px">
<template sc-for list="{{skills}}" as="k" hint-placeholder-count="7">

</template>
</div>
<div class="lab2">
<div>
<p style="margin: 0 0 6px; font-size: 12px; text-transform: uppercase">Produces</p>
<p class="H" style="margin: 0 0 14px; font-size: 1.5rem; line-height: 1.1">{{skill.makes}}</p>
<p style="margin: 0 0 18px; line-height: 1.6">Grounded in {{skill.basis}}.</p>
<template sc-for list="{{skill.bars}}" as="b" hint-placeholder-count="2">
<div style="margin-bottom: 16px">
<p style="margin: 0 0 6px; font-size: 12px; text-transform: uppercase">{{b.label}}</p>
<div style="display: grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items: center; margin-bottom: 4px"><span style="font-size: 13px">With the kit</span><span style="height: 14px; border-radius: 999px; background: #EFEFEF; overflow: hidden"><span style="display: block; height: 100%; width: {{b.withW}}; background: linear-gradient(90deg,#DD00FF,#00FFF7)"></span></span><span style="font-size: 13px; text-align: right">{{b.with}}</span></div>
<div style="display: grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items: center"><span style="font-size: 13px">Without</span><span style="height: 14px; border-radius: 999px; background: #EFEFEF; overflow: hidden"><span style="display: block; height: 100%; width: {{b.withoutW}}; background: #9A9A9A"></span></span><span style="font-size: 13px; text-align: right">{{b.without}}</span></div>
</div>
</template>
</div>
<div style="border: 2px solid #262626; border-radius: 22px; padding: 22px 24px; position: relative">
<span class="stamp" style="position: absolute; right: 18px; top: 16px; color: #C000D8; font-size: 16px">No-go</span>
<p style="margin: 0 0 10px; font-size: 12px; text-transform: uppercase">From the worked example · launch review</p>
<p style="margin: 0 0 10px; line-height: 1.6">A fictional AI feature that drafts client emails at a broker-dealer. The kit's verdict:</p>
<p style="margin: 0 0 8px; line-height: 1.55">— The eval gate failed on promissory language: 2 failures in 120, against a threshold of 0.</p>
<p style="margin: 0 0 8px; line-height: 1.55">— Nobody has decided whether prompts must be kept as records.</p>
<p style="margin: 0 0 8px; line-height: 1.55">— Compliance sign-off is conditional.</p>
<p style="margin: 0; line-height: 1.55">— The launch plan and the brief describe different products.</p>
<p style="margin: 14px 0 0; font-size: 13px">Traps caught: 14 of 14 with the kit, 6 of 14 without.</p>
</div>
</div>
</div>
</template>

<template sc-if value="{{showReplay}}" hint-placeholder-val="{{ false }}">
<div class="egg">
<div style="margin-bottom: 22px">
<p style="margin: 0 0 8px; font-size: 13.5px; text-transform: uppercase">Replay · research &amp; diligence prototype · Gemini, Qdrant, Streamlit</p>
<h3 class="H" style="margin: 0; font-size: 2.4rem; line-height: 1; letter-spacing: -1px">No source, no claim. Watch one run.</h3>

<div>

<div style="display: flex; gap: 8px; margin-top: 14px">

<p style="margin: 16px 0 0; font-size: 12px; text-transform: uppercase">{{replayStatus}}</p>

<p style="margin: 16px 0 0; font-size: 13px; line-height: 1.55; max-width: 860px">A scripted replay of the pipeline's steps, using the same fictional company as the attestor demo. The live prototype needs model keys and runs with design partners, so it isn't public.</p>

<template sc-if value="{{showAsk}}" hint-placeholder-val="{{ false }}">
<div class="egg" style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center; border: 2px solid #262626; border-radius: 22px; padding: 24px">

// attestor-lite: a JavaScript port of attestor's finance-pack checks (github.com/digitallick/attestor)
function attestorLite(answer, sources) {
  const STOP = new Set('a about above across after all also an and any are as at be been before being between both but by can could did do does during each for from had has have he her his how i if in into is it its just more most no nor not of on only or other our out over per s same she should so such than that the their them then there these they this those through to under up very was we were what when where which while who whom will with would you'.split(' '));
  const clean = (t) => t.replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/ /g, ' ').replace(/(\d),(?=\d{3}\b)/g, '$1').split(/\s+/).filter(Boolean).join(' ');
  const norm = (t) => clean(t).toLowerCase();
  const toks = (t) => norm(t).match(/[a-z0-9]+(?:\.\d+)*[a-z%]*/g) || [];
  const ctoks = (t) => toks(t).filter((w) => !STOP.has(w));
  const SCALE = { thousand: 1e3, k: 1e3, million: 1e6, mn: 1e6, mm: 1e6, m: 1e6, billion: 1e9, bn: 1e9, b: 1e9, trillion: 1e12, tn: 1e12 };
  const scan = (text) => {
    text = clean(text).replace(/https?:\/\/\S+|www\.\S+/gi, ' ').replace(/\b\d{1,2}\/\d{1,2}\/(\d{4}|\d{2})\b/g, '$1');
    const out = [];
    const per = /\b(FY|CY|Q[1-4]|H[12])\s?'?(\d{4}|\d{2})?(?!\w)/gi; let m;
    while ((m = per.exec(text))) { let lab = m[1].toUpperCase(), y = m[2]; if (y && y.length === 2) y = '20' + y; const name = y ? ((lab === 'FY' || lab === 'CY') ? lab + y : lab + ' ' + y) : lab; out.push({ pos: m.index, key: 'period|' + name, orig: m[0], implied: y ? ['period|' + lab, '|' + parseFloat(y)] : [] }); }
    const fig = /(?<![\w.])([$€£¥])?(\d+(?:\.\d+)?)(?:\s?(thousand|million|billion|trillion|mn|mm|bn|tn|k|m|b)\b)?(?:\s?(%|percent\b|per cent\b|pct\b)|(x\b|\stimes\b)|\s(bps|basis points)\b)?(?![A-Za-z0-9])/gi;
    while ((m = fig.exec(text))) { let v = parseFloat(m[2]) * (SCALE[(m[3] || '').toLowerCase()] || 1), u; if (m[6]) { u = '%'; v = v / 100; } else u = m[4] ? '%' : m[5] ? 'x' : (m[1] || ''); out.push({ pos: m.index, key: u + '|' + (Math.round(v * 1e4) / 1e4), orig: m[0].trim(), implied: [] }); }
    return out.sort((a, b) => a.pos - b.pos);
  };
  const CUR = '$€£¥';
  const compatible = (a, b) => a === b || (a === '' && CUR.includes(b) && b) || (b === '' && CUR.includes(a) && a);
  const figSupported = (key, pool) => { if (pool.has(key)) return true; const [u, v] = key.split('|'); if (u === 'period') return false; for (const k of pool) { const [u2, v2] = k.split('|'); if (u2 !== 'period' && v2 === v && compatible(u, u2)) return true; } return false; };
