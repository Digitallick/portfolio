<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — Shany Mo</title>
<meta name="description" content="Seven cases, two lenses: the product calls and the design behind them.">
<meta property="og:title" content="Work — Shany Mo">
<meta property="og:description" content="Seven cases, two lenses: the product calls and the design behind them.">
<meta property="og:type" content="website">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/heros-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<script>if(/^staging\./.test(location.hostname)){var m=document.createElement('meta');m.name='robots';m.content='noindex,nofollow';document.head.appendChild(m);}</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#262626}a:hover{color:#8A00A3}
a:focus-visible{outline:2px solid #8A00A3;outline-offset:3px}
.rule{height:1px;background:linear-gradient(90deg,#DD00FF,#00FFF7,#FCA002,#FFFF00,#DD00FF);background-size:200% 100%;animation:slide 8s linear infinite}
@keyframes slide{from{background-position:0 0}to{background-position:200% 0}}
.nav-links{display:flex;flex-wrap:wrap;gap:4px 28px}
.split{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:32px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s8{grid-column:span 8}.s9{grid-column:span 9}
.num{font-family:'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:9rem;line-height:.85;letter-spacing:-6px;color:transparent;-webkit-text-stroke:2px #262626}
.chip{display:inline-block;padding:10px 18px;border-radius:999px;font-family:'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:1.1rem;color:#262626}
@media (max-width:900px){.s3,.s4,.s8,.s9{grid-column:span 12}.big{font-size:2.6rem !important}.num{font-size:5rem}}
@media (prefers-reduced-motion:reduce){.rule{animation:none}}

.mmenu-btn{display:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #262626;background:#FFFFFF;color:#262626;font-family:inherit;font-size:13px;text-transform:uppercase;letter-spacing:1px;align-items:center;gap:8px;cursor:pointer}
.mmenu{position:fixed;inset:0;z-index:90;font-family:'Neue Haas Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.5px;color:#262626;background:linear-gradient(to top,#FFF3FE 0%,#FFFFFF 45%);display:flex;flex-direction:column;padding:20px 24px 28px;box-sizing:border-box;overflow-y:auto;animation:mpop .25s ease-out}
@keyframes mpop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.mmenu .ml{font-family:'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:2.6rem;line-height:1.1;letter-spacing:-1px;text-transform:uppercase;text-decoration:none;color:#262626;padding:4px 0;align-self:flex-start}
.mmenu .ml.on{background:linear-gradient(90deg,#DD00FF,#00FFF7,#FCA002,#FFFF00);padding:0 8px}
.mmenu-x{width:44px;height:44px;border-radius:50%;border:1px solid #262626;background:#FFFFFF;color:#262626;font-size:16px;cursor:pointer}
@media (max-width:600px){
html,body{overflow-x:hidden}
header .nav-links{display:none !important}
.mmenu-btn{display:inline-flex}
.topsec{padding-top:20px !important;padding-bottom:28px !important}
.chips{flex-wrap:nowrap !important;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-right:-2rem;padding-right:2rem;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chips>*{flex:none}
.big{font-size:2.4rem !important;letter-spacing:-1px !important}
.ask{position:fixed !important;min-height:44px !important;padding:0 16px 0 14px !important;right:16px !important;bottom:16px !important;font-size:13px !important;z-index:60}
.panel{position:fixed !important;right:12px !important;left:12px !important;bottom:12px !important;width:auto !important;max-height:calc(100vh - 24px);overflow-y:auto;z-index:70}
}
@media (max-width:600px){
.split{grid-template-columns:minmax(0,1fr) !important;gap:18px 0 !important}
.s3,.s4,.s8,.s9{grid-column:auto !important}
article{padding:44px 0 !important}
article h2{font-size:1.9rem !important;margin-bottom:22px !important}
.num{font-size:4rem !important;letter-spacing:-3px !important}
.chip{font-size:.95rem !important;padding:8px 14px !important}
}

.lens2{display:inline-flex;position:relative;border:2px solid #262626;border-radius:999px;padding:4px;background:#FFFFFF}
.lens2 button{width:120px;position:relative;z-index:1;min-height:44px;padding:0 22px;border:0;background:transparent;border-radius:999px;cursor:pointer;font-family:'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:#262626;transition:color .25s ease}
.lens2 button.on{color:#FFFFFF}
.lens2 .pill{position:absolute;top:4px;bottom:4px;border-radius:999px;background:#262626;transition:left .35s cubic-bezier(.3,1.3,.5,1),width .35s ease}
.flip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #CFCFCF;background:#FFFFFF;cursor:pointer;font-family:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#262626}
.flip:hover{border-color:#262626}
.flip .sw{width:30px;height:16px;border-radius:999px;background:#E4E4E4;position:relative;transition:background .25s}
.flip .sw i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#262626;transition:left .25s cubic-bezier(.3,1.4,.5,1)}
.flip.d .sw{background:linear-gradient(90deg,#DD00FF,#00FFF7)}
.flip.d .sw i{left:16px}
.view{animation:vin .4s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.phone{width:250px;height:510px;border-radius:40px;border:10px solid #262626;background:#FFFFFF;position:relative;overflow:hidden;box-sizing:border-box;flex:none;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.phone:before{content:'';position:absolute;top:8px;left:50%;width:70px;height:18px;margin-left:-35px;border-radius:12px;background:#262626;z-index:2}
.desk{width:480px;max-width:100%;aspect-ratio:16/10;border-radius:16px;border:2px solid #262626;background:#FFFFFF;overflow:hidden;flex:none;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.desk .bar{height:26px;border-bottom:2px solid #262626;display:flex;align-items:center;gap:6px;padding:0 10px}
.desk .bar i{width:8px;height:8px;border-radius:50%;border:1.5px solid #262626}
.dev:hover .phone,.dev:hover .desk{transform:rotate(-1.5deg) translateY(-4px)}
.sk{border-radius:8px;background:#F1F1F1}
.step{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFCFCF;background:#FFFFFF;cursor:pointer;font-family:inherit;font-size:13px;color:#262626}
.step.on{background:#262626;color:#FFFFFF;border-color:#262626}
.need{display:inline-block;padding:3px 10px;border-radius:6px;background:#FFF3FE;border:1px dashed #C000D8;color:#8A00A3;font-size:12px}
.dgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:start}
.reel{border-radius:24px;border:2px solid #262626;overflow:hidden;position:relative;aspect-ratio:16/7;background:linear-gradient(120deg,#F5C9FF,#B8FFFC,#FFE2B0,#FFFFA8);background-size:300% 300%;animation:reel 9s ease-in-out infinite}
@keyframes reel{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@media (max-width:900px){.dgrid{grid-template-columns:minmax(0,1fr)}.dev{justify-content:center}.desk{width:100%}}
@media (max-width:600px){.phone{width:210px;height:430px}.lens2 button{padding:0 16px;font-size:13px}.reel{aspect-ratio:4/3}}
@media (prefers-reduced-motion:reduce){.view,.reel{animation:none}.lens2 .pill{transition:none}}

@media (prefers-reduced-motion:reduce){.ad{transition:none}}

.bgfx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
.lift{position:relative;z-index:1}
.lensrex{position:relative;width:86px;height:86px;flex:none;cursor:pointer;border:0;background:transparent;padding:0}
.lensrex img{width:86px;height:86px;display:block}
.lensrex.hopA img{animation:hopA .55s cubic-bezier(.3,1.6,.5,1)}
.lensrex.hopB img{animation:hopB .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes hopA{0%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-8deg)}100%{transform:none}}
@keyframes hopB{0%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(8deg)}100%{transform:none}}
.lensrex .say{position:absolute;left:78px;top:-6px;white-space:nowrap;font-family:'Caveat',cursive;font-weight:600;font-size:24px;color:#8A00A3;transform:rotate(-4deg)}
.adtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.adtile{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:#141414;border:1px solid #262626}
.adtile video{width:100%;height:100%;object-fit:cover;display:block}
.adtile span{position:absolute;left:6px;bottom:6px;background:#FFFF00;color:#262626;font-size:10.5px;padding:2px 6px;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace}
@media (max-width:600px){.adtiles{grid-template-columns:repeat(2,minmax(0,1fr))}.lensrex .say{display:none}}
@media (prefers-reduced-motion:reduce){.lensrex img{animation:none !important}}

.mqtrack{display:flex;width:max-content;animation:mqmarq 150s linear infinite}
@keyframes mqmarq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ask{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#DD00FF,#00FFF7,#FCA002,#FFFF00) border-box;border:2px solid transparent;transition:transform .2s ease}
.ask:hover{transform:translateY(-2px) rotate(-1deg)}
.q:hover{border-color:#262626 !important}
.askegg{animation:askpop .35s ease-out}
@keyframes askpop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:900px){.panel{left:16px !important;right:16px !important;width:auto !important}}
@media (prefers-reduced-motion:reduce){.mqtrack{animation:none}.ask:hover{transform:none}}

.askwig{animation:askwig .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes askwig{0%{transform:rotate(0) scale(1)}20%{transform:rotate(-14deg) scale(1.1)}40%{transform:rotate(12deg) scale(.95)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}100%{transform:rotate(0) scale(1)}}

.panel,.ask{font-family:'Neue Haas Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;color:#262626;letter-spacing:.5px}

.dstage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px;border-radius:24px;background:#FAFAFA;border:1px solid #E4E4E4}
.dstage .dev{width:100%;justify-content:center}
.dstage .desk{width:min(760px,100%)}
.flowbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.flowbar .fl{font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin-right:6px;color:#5E5E5E}
@media (max-width:600px){.dstage{padding:16px}}

.dstage{position:relative}
.cdot{position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:50%;font-size:0;color:#FFFFFF}
.pins{display:none}
/* Beside */
.dl-beside .dwrap{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;align-items:start}
.dl-beside .dtext{margin-top:0 !important;display:flex !important;flex-direction:column;gap:24px}
/* Annotated */
.dl-annotated .dtext{margin-top:28px !important;display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 32px;align-items:start}
.dl-annotated .dtext>.s4{grid-column:auto}
@media (max-width:900px){.dl-annotated .dtext{grid-template-columns:minmax(0,1fr)}}
.dl-annotated .pins{display:block;position:absolute;inset:28px 28px 80px 28px;pointer-events:none}
.dl-annotated .pin{position:absolute;width:30px;height:30px;border-radius:50%;color:#FFFFFF;font:700 14px/30px 'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center;box-shadow:0 0 0 4px #FFFFFF,0 6px 14px rgba(38,38,38,.25);animation:pinpop .4s cubic-bezier(.3,1.6,.5,1) both}
.dl-annotated .pin:nth-child(2){animation-delay:.08s}.dl-annotated .pin:nth-child(3){animation-delay:.16s}
@keyframes pinpop{from{transform:scale(0)}to{transform:none}}
.dl-annotated .cdot{width:24px;height:24px;top:0;font:700 12px/24px 'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center}
.dl-annotated .dcalls p[style*="padding-left: 18px"]{padding-left:34px !important}
.dl-annotated .dbrief{background:#FFFFA8;padding:16px 18px;transform:rotate(-1.5deg);box-shadow:0 8px 20px rgba(38,38,38,.12)}
.dl-annotated .dbrief p:last-child{font-family:'Caveat',cursive;font-weight:600;font-size:1.6rem;line-height:1.15}
.dl-annotated .dtrade{border-top:1px dashed #262626;padding-top:14px}
@media (max-width:900px){.dl-beside .dwrap,.dl-annotated .dwrap{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.pin{animation:none !important}}

@media (max-width:600px){.scribt{font-size:21px !important;line-height:1.1}}
.betbadge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 12px;border-radius:999px;background:#FFFFA8;border:1.5px dashed #262626;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
.betbadge i{width:8px;height:8px;border-radius:50%;background:#00C4BD;animation:betpulse 1.4s ease-in-out infinite}
@keyframes betpulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.betbadge i{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">

<div style="position: relative; background: linear-gradient(to top, #FFF3FE 0%, #FFFFFF 12%); color: #262626; font-family: 'Neue Haas Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; letter-spacing: 0.5px; min-height: 100%">
<canvas class="bgfx" ref="{{bgRef}}" aria-hidden="true"></canvas>
<div class="lift" style="max-width: 1320px; margin: 0 auto; padding: 0 2rem">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 28px 0">
<a href="/" aria-label="Shany Mo, home" style="font-family: 'TeX Gyre Heros', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -1px; text-decoration: none; line-height: 1">_mo</a>
<nav aria-label="Primary" class="nav-links" style="font-size: 13.5px; text-transform: uppercase">
<a href="/" style="text-decoration: none; padding: 12px 0">Home</a>
<a href="/work/" aria-current="page" style="text-decoration: underline; text-decoration-color: #DD00FF; text-decoration-thickness: 3px; text-underline-offset: 6px; padding: 12px 0">Work</a>
<a href="/inventory/" style="text-decoration: none; padding: 12px 0">Inventory</a>
<a href="/lab/" style="text-decoration: none; padding: 12px 0">Lab</a>
<a href="mailto:hello@shanymo.com" style="text-decoration: none; padding: 12px 0">Contact ↗</a>
</nav>
<button class="mmenu-btn" onClick="{{openMenu}}" aria-label="Open menu"><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M0 1h16M0 6h16M0 11h16" stroke="currentColor" stroke-width="2"></path></svg>Menu</button>
</header>

<section class="topsec" style="padding: 96px 0 56px">
<div class="rule"></div>
<p style="margin: 0; padding: 12px 0; font-size: 13.5px">Work — seven cases, each readable in two minutes. Two lenses on every one.</p>
<div class="rule"></div>
<h1 class="big" style="margin: 36px 0 0; font-family: 'TeX Gyre Heros', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 5rem; line-height: 1.02; letter-spacing: -1.5px; text-transform: uppercase; max-width: 1100px">The bet. The craft. <span style="background: linear-gradient(90deg,#00FFF7,#FFFF00); padding: 0 12px">What moved.</span></h1>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-top: 36px">
<div class="lens2" role="group" aria-label="Choose a lens for every case">
<span class="pill" aria-hidden="true" style="left: {{pillLeft}}; width: {{pillW}}"></span>
<button class="{{pBtn}}" onClick="{{allProduct}}" aria-pressed="{{pPressed}}">Product</button>
<button class="{{dBtn}}" onClick="{{allDesign}}" aria-pressed="{{dPressed}}">Design</button>
</div>
<button class="{{rexCls}}" onClick="{{rexPoke}}" aria-label="Poke the monster to switch lenses"><img src="/assets/trex-fluent-anim.webp" alt=""><span class="say" aria-hidden="true">{{rexSay}}</span></button>
<p style="margin: 0; font-size: 14px; line-height: 1.5; max-width: 520px">{{lensLine}}</p>
</div>
</section>
<template sc-for list="{{cases}}" as="c" hint-placeholder-count="6">
<article aria-label="{{c.title}}" style="padding: 72px 0; border-top: 1px solid #262626">
<div class="split">
<div class="s3"><p class="num" aria-hidden="true" style="margin: 0">{{c.n}}</p>
<button class="{{c.flipCls}}" onClick="{{c.flip}}" aria-pressed="{{c.isDesign}}" style="margin-top: 18px"><span>Product</span><span class="sw" aria-hidden="true"><i></i></span><span>Design</span></button>
<template sc-if value="{{c.live}}" hint-placeholder-val="{{ false }}"><br><span class="betbadge"><i aria-hidden="true"></i>Bet in progress</span></template>
</div>
<div class="s9">
<p style="margin: 0 0 12px; font-size: 13.5px; text-transform: uppercase">{{c.meta}}</p>
<h2 style="margin: 0 0 32px; font-family: 'TeX Gyre Heros', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 3rem; line-height: 1.02; text-transform: uppercase; letter-spacing: -1px">{{c.title}}</h2>

<template sc-if value="{{c.showProduct}}" hint-placeholder-val="{{ true }}">
<div class="view">
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 36px">
<template sc-for list="{{c.chips}}" as="k" hint-placeholder-count="3"><span class="chip" style="background: {{k.bg}}">{{k.t}}</span></template>
</div>
<template sc-if value="{{c.hasScrib}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="display: flex; align-items: center; gap: 8px; margin: -26px 0 28px 24px; transform: rotate({{c.rot}})">
<svg width="64" height="40" viewBox="0 0 64 40" fill="none" stroke="{{c.ink}}" stroke-width="2.4" stroke-linecap="round"><path d="M60 34 C 40 36, 18 28, 8 8"></path><path d="M8 8 L 6 20 M8 8 L 19 12"></path></svg>
<span class="scribt" style="font-family: 'Caveat', cursive; font-weight: 600; font-size: 28px; color: {{c.inkDark}}">{{c.scrib}}</span>
</div>
</template>
<div class="split" style="gap: 24px 40px">
<div class="s4"><p style="margin: 0 0 8px; font-size: 13.5px; text-transform: uppercase">Situation</p><p style="margin: 0; line-height: 1.65">{{c.situation}}</p></div>
<div class="s4"><p style="margin: 0 0 8px; font-size: 13.5px; text-transform: uppercase">The bet</p><p style="margin: 0; line-height: 1.65">{{c.bet}}</p></div>
<div class="s4"><p style="margin: 0 0 8px; font-size: 13.5px; text-transform: uppercase">{{c.didLabel}}</p><p style="margin: 0; line-height: 1.65">{{c.did}}</p></div>
</div>
<template sc-if value="{{c.extra}}" hint-placeholder-val="{{ true }}"><p style="margin: 32px 0 0; line-height: 1.65">{{c.extra}}</p></template>
</div>
</template>

<template sc-if value="{{c.showDesign}}" hint-placeholder-val="{{ false }}">
<div class="{{dlCls}}">
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 36px"><span class="chip" style="background: {{c.tint}}">{{c.designNumber}}</span></div>
<div class="dwrap">
<div class="dstage">
<div class="dev" style="display: flex">
<template sc-if value="{{c.isPhone}}" hint-placeholder-val="{{ true }}">
<div class="phone" role="img" aria-label="{{c.screenAlt}}">
<div style="position: absolute; inset: 0; padding: 40px 16px 16px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(to bottom, {{c.tint}} 0%, #FFFFFF 45%)">
<p style="margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px">{{c.stepTag}}</p>
<p style="margin: 0; font-family: 'TeX Gyre Heros', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1; text-transform: uppercase">{{c.stepTitle}}</p>
<div class="sk" style="height: 120px; background: {{c.tint}}"></div>
<div class="sk" style="height: 14px; width: 80%"></div><div class="sk" style="height: 14px; width: 60%"></div>
<div class="sk" style="height: 44px; margin-top: auto; border-radius: 999px; background: #262626"></div>
<p style="margin: 0; text-align: center"><span class="need">[screen needed]</span></p>
</div>
</div>
</template>
<template sc-if value="{{c.isDesk}}" hint-placeholder-val="{{ false }}">
<div class="desk" role="img" aria-label="{{c.screenAlt}}">
<div class="bar"><i></i><i></i><i></i><span style="margin-left: 8px; font-size: 11px">{{c.stepTag}}</span></div>
<div style="display: grid; grid-template-columns: 30% 1fr; gap: 10px; padding: 12px; height: calc(100% - 26px); box-sizing: border-box; background: linear-gradient(135deg, {{c.tint}} 0%, #FFFFFF 55%)">
<div style="display: flex; flex-direction: column; gap: 8px"><div class="sk" style="height: 16px"></div><div class="sk" style="height: 16px; width: 70%"></div><div class="sk" style="height: 16px; width: 85%"></div><div class="sk" style="flex: 1"></div></div>
