html{scrollbar-gutter:stable}
body{margin:0;background:#FFFFFF}
a{color:#262626}a:hover{color:#8A00A3}

.H{font-family:'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;text-transform:uppercase}
.pit{position:relative;height:calc(100vh - 136px);height:calc(100svh - 136px);min-height:560px;overflow:hidden;background:transparent}
.pit{margin:0 calc(50% - 50vw);width:100vw}

.cta{min-height:56px;padding:0 26px;border-radius:999px;border:0;cursor:pointer;font-size:15px;letter-spacing:.5px;display:inline-flex;align-items:center;gap:10px}
.cta.dark{background:#262626;color:#FFFFFF;box-shadow:0 6px 0 -1px #00FFF7,0 11px 0 -1px #DD00FF}

.mini{position:absolute;left:20px;bottom:18px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:auto}
.mini a,.mini button{background:rgba(255,255,255,.92);border:1px solid #262626;border-radius:999px;padding:9px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;text-decoration:none;color:#262626;cursor:pointer;font-family:inherit}
.hint{position:absolute;right:20px;bottom:22px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;background:rgba(255,255,255,.88);padding:6px 10px;border-radius:999px}

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mail: false, kind: 'role', from: '', subject: '🦖 A role at your team', msg: '', copied: false };
  }
  componentDidMount() { this.startPit(); }
  componentWillUnmount() { this.dead = true; }
  startPit() {
    if (this.started) return; this.started = true;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const rex = new Image(); rex.src = '/assets/trex-fluent-3d.png';
    const TREATS = ['/assets/fries_smile-128.png', '/assets/heart_pink-128.png', '/assets/rainbow_brand-128.png', '/assets/lollipop-128.png', '/assets/sparkles-128.png'].map((u) => { const im = new Image(); im.src = u; return im; });
    const L = [[], []]; // 0 = back layer, 1 = front layer
    let el = null, ctx = null, W = 0, H = 0, mode = '', drag = null, last = 0, cap = [0, 0];
    const ptr = { x: -999, y: -999, vx: 0, vy: 0, down: false };
    const fit = () => { const r = el.getBoundingClientRect(); const w = Math.round(r.width), h = Math.round(r.height); if (w < 2 || (w === W && h === H)) return false; W = w; H = h; const dpr = Math.min(window.devicePixelRatio || 1, 2); el.width = W * dpr; el.height = H * dpr; ctx = el.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return true; };
    const kindFor = () => { const m = this.props.objects || 'Mixed'; return m === 'Monsters only' ? 'rex' : m === 'Treats only' ? 'treat' : (Math.random() < 0.55 ? 'treat' : 'rex'); };
    const spawn = (layer) => {
      const small = W < 600, base = (small ? 0.75 : 1) * (layer === 0 ? 0.72 : 1);
      const kind = kindFor(), r = base * (kind === 'rex' ? 30 + Math.random() * 14 : 26 + Math.random() * 10);
      L[layer].push({ kind, r, x: r + Math.random() * (W - 2 * r), y: -r * 2 - Math.random() * 60, px: 0, py: 0, a: (Math.random() - .5) * 0.5, va: (Math.random() - .5) * .012, img: TREATS[(Math.random() * TREATS.length) | 0] });
      const b = L[layer][L[layer].length - 1]; b.px = b.x + (Math.random() - .5) * 2; b.py = b.y - 3;
    };
    const reset = () => { mode = this.props.objects || 'Mixed'; L[0] = []; L[1] = [];
      const small = W < 600; cap[1] = Math.round(0.75 * W * H / (small ? 2600 : 3800)); cap[0] = cap[1];
      // start with a head start so the page is never empty, then keep raining
      for (let i = 0; i < cap[0] * 0.35; i++) { spawn(0); const b = L[0][i]; b.y = H - Math.random() * H * 0.5; b.py = b.y; }
      for (let i = 0; i < cap[1] * 0.2; i++) { spawn(1); const b = L[1][i]; b.y = H - Math.random() * H * 0.35; b.py = b.y; } };
    const toLocal = (e) => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    window.addEventListener('pointermove', (e) => { if (!el) return; const p = toLocal(e); ptr.vx = p.x - ptr.x; ptr.vy = p.y - ptr.y; ptr.x = p.x; ptr.y = p.y; if (drag) { drag.x = p.x; drag.y = p.y; } }, { passive: true });
    window.addEventListener('pointerup', () => { if (drag) { drag.px = drag.x - ptr.vx; drag.py = drag.y - ptr.vy; } drag = null; ptr.down = false; });
    const attach = (c) => c.addEventListener('pointerdown', (e) => {
      const p = toLocal(e); ptr.x = p.x; ptr.y = p.y; ptr.down = true; let best = null, bd = 1e9;
      for (const b of L[1]) { const d = (b.x - p.x) ** 2 + (b.y - p.y) ** 2; if (d < b.r * b.r * 1.4 && d < bd) { bd = d; best = b; } }
      if (best) { drag = best; return; }
      for (const lay of L) for (const b of lay) { const dx = b.x - p.x, dy = b.y - p.y, d = Math.sqrt(dx * dx + dy * dy) + 1; if (d < 280) { const k = (280 - d) / 280 * 28; b.px = b.x - dx / d * k; b.py = b.y - dy / d * k - k * 0.6; b.va += (Math.random() - .5) * .08; } }
    });
    const sim = (B, push) => {
      const G = 0.36;
      for (const b of B) {
        if (b === drag) { b.px = b.x; b.py = b.y; continue; }
        const vx = (b.x - b.px) * 0.99, vy = (b.y - b.py) * 0.99; b.px = b.x; b.py = b.y; b.x += vx; b.y += vy + G;
        if (push && !ptr.down) { const dx = b.x - ptr.x, dy = b.y - ptr.y, d2 = dx * dx + dy * dy; if (d2 < 6500 * push && (Math.abs(ptr.vx) + Math.abs(ptr.vy)) > 2) { b.x += ptr.vx * 0.28 * push; b.y += ptr.vy * 0.28 * push - 1.5 * push; b.va += ptr.vx * 0.0012; } }
        b.a += b.va; b.va *= 0.95; b.va += vx * 0.0006; if (b.a > 0.9) b.va -= 0.004; if (b.a < -0.9) b.va += 0.004;
      }
      // spatial hash keeps hundreds of bodies cheap
      const cell = 90, grid = new Map();
      B.forEach((b, i) => { const k = ((b.x / cell) | 0) + ',' + ((b.y / cell) | 0); (grid.get(k) || grid.set(k, []).get(k)).push(i); });
      for (let it = 0; it < 3; it++) {
