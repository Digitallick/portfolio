<style>
body{margin:0;background:#FFFFFF}
a{color:#262626}a:hover{color:#8A00A3}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #8A00A3;outline-offset:3px}
.rule{height:1px;background:linear-gradient(90deg,#DD00FF,#00FFF7,#FCA002,#FFFF00,#DD00FF);background-size:200% 100%;animation:slide 8s linear infinite}
@keyframes slide{from{background-position:0 0}to{background-position:200% 0}}
.track{display:flex;width:max-content;animation:marq 150s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.lens:hover{border-color:#262626 !important}
.ask{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#DD00FF,#00FFF7,#FCA002,#FFFF00) border-box;border:2px solid transparent;transition:transform .2s ease}
.ask:hover{transform:translateY(-2px) rotate(-1deg)}
.q:hover{border-color:#262626 !important}
.fry{animation:wob 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.wig{animation:wig .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes wig{0%{transform:rotate(0) scale(1)}20%{transform:rotate(-14deg) scale(1.08)}40%{transform:rotate(12deg) scale(.96)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}100%{transform:rotate(0) scale(1)}}
.egg{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.screen{min-height:100vh;min-height:100svh;overflow-x:clip}
.proof{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:40px;align-items:end}
.nav-links{display:flex;flex-wrap:wrap;gap:4px 28px}
@media (max-width:900px){.screen{height:auto;min-height:100vh;overflow:visible}.proof{grid-template-columns:minmax(0,1fr);gap:16px}.panel{left:16px !important;right:16px !important;width:auto !important}}
.napper{position:absolute;top:0;right:9%;width:150px;display:flex;flex-direction:column;align-items:center;transform:translateY(-110%);transition:transform 1s cubic-bezier(.3,1.5,.5,1);pointer-events:none;z-index:4}
.napper.on{transform:translateY(0)}
.napper .sway{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.napper .z{font-family:'TeX Gyre Heros',Helvetica,Arial,sans-serif;font-weight:700;position:absolute;right:-6px;bottom:40px;animation:zz 3s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%,70%{opacity:1}100%{opacity:0;transform:translate(10px,-14px)}}
@media (prefers-reduced-motion:reduce){.rule,.track,.napper .sway,.napper .z{animation:none}.ask:hover{transform:none}.napper{transition:none}}

.mmenu-btn{display:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #262626;background:#FFFFFF;color:#262626;font-family:inherit;font-size:13px;text-transform:uppercase;letter-spacing:1px;align-items:center;gap:8px;cursor:pointer}
.mmenu{position:fixed;inset:0;z-index:90;font-family:'Neue Haas Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.5px;color:#262626;background:linear-gradient(to top,#FFF3FE 0%,#FFFFFF 45%);display:flex;flex-direction:column;padding:20px 24px 28px;box-sizing:border-box;overflow-y:auto;animation:mpop .25s ease-out}
@keyframes mpop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.mmenu .ml{font-family:'TeX Gyre Heros','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:2.6rem;line-height:1.1;letter-spacing:-1px;text-transform:uppercase;text-decoration:none;color:#262626;padding:4px 0;align-self:flex-start}
.mmenu .ml.on{background:linear-gradient(90deg,#DD00FF,#00FFF7,#FCA002,#FFFF00);padding:0 8px}
.mmenu-x{width:44px;height:44px;border-radius:50%;border:1px solid #262626;background:#FFFFFF;color:#262626;font-size:16px;cursor:pointer}
@media (max-width:600px){
html,body{overflow-x:hidden}
header .nav-links{display:none !important}
.mmenu-btn{display:inline-flex}
.topsec{padding-top:20px !important;padding-bottom:28px !important}
.chips{flex-wrap:nowrap !important;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-right:-2rem;padding-right:2rem;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chips>*{flex:none}
.big{font-size:2.4rem !important;letter-spacing:-1px !important}
.ask{position:fixed !important;min-height:44px !important;padding:0 16px 0 14px !important;right:16px !important;bottom:16px !important;font-size:13px !important;z-index:60}
.panel{position:fixed !important;right:12px !important;left:12px !important;bottom:12px !important;width:auto !important;max-height:calc(100vh - 24px);overflow-y:auto;z-index:70}
}
@media (max-width:600px){
main h1{font-size:2.1rem !important;margin-top:20px !important;letter-spacing:-1px !important}
main{padding-bottom:8px !important}
.slot{height:110px !important}
.proof{padding-top:16px !important}
.proof p{font-size:15px}
.screen{padding-bottom:72px}
}

.askwig{animation:askwig .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes askwig{0%{transform:rotate(0) scale(1)}20%{transform:rotate(-14deg) scale(1.1)}40%{transform:rotate(12deg) scale(.95)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}100%{transform:rotate(0) scale(1)}}

@media (max-width:900px){.lens{min-height:34px !important;padding:0 12px !important;font-size:11.5px !important;letter-spacing:.3px !important;box-shadow:none !important}.lens[aria-selected="true"]{box-shadow:0 3px 0 -1px #00FFF7,0 5px 0 -1px #DD00FF !important}}

html{scrollbar-gutter:stable}

.nav-links a{padding:12px 8px !important;margin:0 -8px;border-radius:8px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}


/* chips that scroll sideways: fade the hidden edge and nudge once so people see there is more */
.chips[data-more="r"]{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 96px),transparent);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 96px),transparent)}
.chips[data-more="l"]{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px);mask-image:linear-gradient(90deg,transparent,#000 40px)}
.chips[data-more="lr"]{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 96px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 96px),transparent)}

/* every project takes the same room, so switching never moves the footer */
@media (min-width:901px){.proof > div:first-child{min-height:200px}}

/* short laptop screens (13"): tighten the hero so the whole page, footer included, fits without scrolling */
@media (min-width:901px) and (max-height:900px){.hh{font-size:min(5rem,8.6vh) !important;margin-top:14px !important}.hh + div{margin:18px 0 16px !important}.proof{padding-top:16px !important}}
</style>

</head>

<main style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 8px 0 24px">

<h1 class="hh" style="margin: 28px 0 0; font-family: 'TeX Gyre Heros', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; font-size: clamp(2.4rem, 5.6vw, 5rem); line-height: 1.02; letter-spacing: -1.5px; text-transform: uppercase; max-width: 1200px">I turn <span style="background: linear-gradient(90deg,#DD00FF,#00FFF7,#FCA002,#FFFF00); padding: 0 10px; box-decoration-break: clone; -webkit-box-decoration-break: clone">new technology</span> into products, partnerships and revenue.</h1>

</template>
</div>
</div>

<div role="tabpanel" aria-live="polite" class="proof" style="border-top: 1px solid #262626; padding-top: 24px">
